<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карточка — Glassmorphism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(135deg, #e8f5f1 0%, #d4ede6 30%, #f0f4f8 60%, #e2eaf2 100%);
      background-attachment: fixed;
    }

    .glass-card {
      width: 300px;
      height: 400px;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.06),
        0 2px 8px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .glass-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.1),
        0 4px 16px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .glass-card__image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .glass-card__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      min-height: 0;
    }
    .glass-card__title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .glass-card__description {
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
      flex: 1;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .glass-card__action {
      margin-top: auto;
    }
    .glass-card__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, #25c79a 0%, #12a57c 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(18, 165, 124, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-card__btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(18, 165, 124, 0.45);
    }
    .glass-card__btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <article class="glass-card">
    <img
      class="glass-card__image"
      src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=600&h=400&fit=crop"
      alt=""
    />
    <div class="glass-card__body">
      <h2 class="glass-card__title">Современный интерфейс</h2>
      <p class="glass-card__description">
        Карточка в стиле стеклянного морфизма: размытие фона, мягкие тени и аккуратная типографика для современного веб-дизайна.
      </p>
      <div class="glass-card__action">
        <button type="button" class="glass-card__btn">Подробнее</button>
      </div>
    </div>
  </article>
</body>
</html>
