<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12a57c" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Libiss POS — руководства по установке и использованию." />
    <title>Libiss POS — Руководства</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.25s;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="container nav">
          <a class="logo" href="/" aria-label="Libiss POS">
            <img class="logo-image" src="/logo.png" alt="Libiss" />
            <span>Libiss POS</span>
          </a>
          <div class="lang-toggle" role="group" aria-label="Language">
            <button class="lang-btn is-active" type="button" data-lang="ru">RU</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <main class="documentation-page">
        <div class="container">
          <p class="documentation-back">
            <a href="/docs.html" data-i18n="documentation.backDocs">← Краткая документация и скачивание</a>
          </p>
          <h1 class="section-title" data-i18n="documentation.title">Руководства Libiss POS</h1>
          <p class="section-subtitle" data-i18n="documentation.subtitle">
            Полный текст: установка и ежедневная работа. Язык переключателя влияет на файл (RU/EN).
          </p>

          <div class="doc-tabs" role="tablist" aria-label="Manual">
            <button type="button" class="btn btn-secondary doc-tab is-active" role="tab" aria-selected="true" data-doc-tab="install" data-i18n="documentation.tabInstall">
              Установка
            </button>
            <button type="button" class="btn btn-secondary doc-tab" role="tab" aria-selected="false" data-doc-tab="usage" data-i18n="documentation.tabUsage">
              Использование
            </button>
          </div>

          <p class="documentation-error" data-doc-error hidden></p>
          <pre class="doc-manual-pre" id="doc-manual-body"></pre>
        </div>
      </main>
    </div>

    <script type="module" src="/src/js/pages/documentation.js"></script>
  </body>
</html>
