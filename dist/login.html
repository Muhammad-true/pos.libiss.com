<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12a57c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Вход для действующих клиентов Libiss POS." />
    <meta property="og:title" content="Libiss POS — Вход" />
    <meta
      property="og:description"
      content="Войдите по номеру телефона и паролю, чтобы продолжить работу."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pos.libiss.com/login" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://pos.libiss.com/login" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <title>Libiss POS — Вход</title>
    <style>body { opacity: 0; transition: opacity 0.3s; }</style>
    <script type="module" crossorigin src="/assets/login-CTd_DK4E.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/styles-DFLsS0p2.js">
    <link rel="modulepreload" crossorigin href="/assets/translations-0ZI7kZY5.js">
    <link rel="modulepreload" crossorigin href="/assets/api-D5zH2I3w.js">
    <link rel="modulepreload" crossorigin href="/assets/index-DNQiN_gI.js">
    <link rel="stylesheet" crossorigin href="/assets/styles-DVZkw6iq.css">
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="container nav">
          <a class="logo" href="/" aria-label="Libiss POS">
            <img class="logo-image" src="/logo.png" alt="Libiss" />
            <span>Libiss POS</span>
          </a>
          <div class="lang-toggle" role="group" aria-label="Language">
            <button class="lang-btn is-active" type="button" data-lang="ru">
              RU
            </button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <main class="form-page">
        <section class="form-hero">
          <div class="container">
            <div class="form-hero-inner">
              <span class="eyebrow" data-i18n="login.eyebrow">Вход</span>
              <h1 data-i18n="login.title">Добро пожаловать обратно</h1>
              <p data-i18n="login.subtitle">
                Войдите по номеру телефона и паролю.
              </p>
              <div class="form-card">
                <form class="form" data-form>
                  <div class="field">
                    <label for="phone" data-i18n="login.phone">Телефон</label>
                    <div class="phone-input-wrapper">
                      <div class="country-selector" data-country-selector>
                        <button type="button" class="country-selector-btn" data-country-btn>
                          <span class="country-flag" data-country-flag>🇹🇯</span>
                          <span class="country-code" data-country-code>+992</span>
                          <svg class="country-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 4.5L6 7.5L9 4.5"/>
                          </svg>
                        </button>
                        <div class="country-dropdown" data-country-dropdown hidden>
                          <div class="country-option" data-country="TJ" data-code="+992">
                            <span class="country-flag">🇹🇯</span>
                            <span class="country-name">Таджикистан</span>
                            <span class="country-code">+992</span>
                          </div>
                          <div class="country-option" data-country="UZ" data-code="+998">
                            <span class="country-flag">🇺🇿</span>
                            <span class="country-name">Узбекистан</span>
                            <span class="country-code">+998</span>
                          </div>
                          <div class="country-option" data-country="KZ" data-code="+7">
                            <span class="country-flag">🇰🇿</span>
                            <span class="country-name">Казахстан</span>
                            <span class="country-code">+7</span>
                          </div>
                          <div class="country-option" data-country="KG" data-code="+996">
                            <span class="country-flag">🇰🇬</span>
                            <span class="country-name">Кыргызстан</span>
                            <span class="country-code">+996</span>
                          </div>
                          <div class="country-option" data-country="TM" data-code="+993">
                            <span class="country-flag">🇹🇲</span>
                            <span class="country-name">Туркменистан</span>
                            <span class="country-code">+993</span>
                          </div>
                          <div class="country-option" data-country="RU" data-code="+7">
                            <span class="country-flag">🇷🇺</span>
                            <span class="country-name">Россия</span>
                            <span class="country-code">+7</span>
                          </div>
                        </div>
                      </div>
                      <input
                        id="phone"
                        name="phone"
                        type="tel"
                        autocomplete="tel"
                        required
                        data-i18n-attr="placeholder"
                        data-i18n-key="login.phonePlaceholder"
                        placeholder="901234567"
                        data-phone-input
                      />
                    </div>
                    <input type="hidden" name="countryCode" value="+992" data-country-code-input />
                  </div>
                  <div class="field">
                    <label for="password" data-i18n="login.password"
                      >Пароль</label
                    >
                    <input
                      id="password"
                      name="password"
                      type="password"
                      autocomplete="current-password"
                      required
                      data-i18n-attr="placeholder"
                      data-i18n-key="login.passwordPlaceholder"
                      placeholder="••••••••"
                    />
                  </div>
                  <div class="field field--checkbox" data-agree-block>
                    <label class="label-checkbox">
                      <input type="checkbox" name="agreeTerms" id="loginAgreeTerms" data-agree-terms />
                      <span data-i18n-html="login.agreeTermsHtml">Входя, вы соглашаетесь с <a href="/legal-view.html#terms_shop" target="_blank" rel="noopener">условиями</a> и <a href="/legal-view.html#privacy_shop" target="_blank" rel="noopener">политикой конфиденциальности</a></span>
                    </label>
                  </div>
                  <div class="form-actions">
                    <button class="btn btn-primary" type="submit" data-i18n="login.submit" data-login-submit disabled>
                      Войти
                    </button>
                    <a class="btn btn-secondary" href="/" data-i18n="login.back">
                      Назад
                    </a>
                  </div>
                  <div class="status" data-status aria-live="polite"></div>
                </form>
              </div>
              <a class="form-link" href="/create-store.html" data-i18n="login.create">
                Создать новый магазин
              </a>
            </div>
          </div>
        </section>
      </main>
    </div>

  </body>
</html>
